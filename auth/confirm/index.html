<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>GPTBOC 이메일 확인</title>
  <script>
    (() => {
      const fragment = new URLSearchParams(location.hash.replace(/^#/, ''));
      const query = new URLSearchParams(location.search);
      const hasError = Boolean(fragment.get('error') || query.get('error'));
      history.replaceState(null, document.title, location.pathname);
      addEventListener('DOMContentLoaded', () => {
        const title = document.getElementById('result-title');
        const message = document.getElementById('result-message');
        if (hasError) {
          title.textContent = '인증 링크를 확인할 수 없습니다';
          message.textContent = '이전 링크 대신 가장 최근에 받은 확인 메일을 사용해 주세요.';
          document.body.dataset.status = 'error';
          return;
        }
        title.textContent = '이메일 확인이 처리되었습니다';
        message.textContent = '이 창을 닫고 GPTBOC로 돌아가 주세요.';
        document.body.dataset.status = 'success';
      }, { once: true });
    })();
  </script>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; color: #17212b; }
    main { width: min(520px, calc(100% - 32px)); border: 1px solid #d8dee5; background: #fff; padding: 32px; box-sizing: border-box; }
    .status { width: 12px; height: 12px; margin-bottom: 20px; background: #297a4a; }
    body[data-status="error"] .status { background: #b0443c; }
    h1 { margin: 0 0 12px; font-size: 24px; letter-spacing: 0; }
    p { margin: 0; color: #4b5967; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="status" aria-hidden="true"></div>
    <h1 id="result-title">이메일 확인 처리 중</h1>
    <p id="result-message">잠시 기다려 주세요.</p>
  </main>
</body>
</html>
